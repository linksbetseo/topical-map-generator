# Local stack: Postgres + API + worker. PAPER only; no signer service exists.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: solbot
      POSTGRES_PASSWORD: solbot
      POSTGRES_DB: solbot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solbot"]
      interval: 5s
      retries: 10
  api:
    build: .
    command: ["pnpm", "--filter", "@solbot/api", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://solbot:solbot@db:5432/solbot
      MODE: PAPER
      LIVE_ENABLED: "false"
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }
  worker:
    build: .
    command: ["pnpm", "--filter", "@solbot/worker", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://solbot:solbot@db:5432/solbot
      MODE: PAPER
      LIVE_ENABLED: "false"
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  pgdata: {}

# Copy to .github/workflows/solana-bot.yml at the repository root to enable.
name: solana-bot
on:
  push: { paths: ["solana-bot/**"] }
  pull_request: { paths: ["solana-bot/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: solana-bot } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: solbot, POSTGRES_PASSWORD: solbot, POSTGRES_DB: solbot_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://solbot:solbot@localhost:5432/solbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2

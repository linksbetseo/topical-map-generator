# EURUSD - reakcja na publikacje USA o 08:30 Nowy Jork (NFP, CPI, PPI, sprzedaż, PKB, zasiłki).
# Bot daily: jedno wejście dziennie najwyżej, flat 16:30 UTC. Blackout kalendarza wyłączony - tu publikacja JEST sygnałem.
# Parametry strategii ustalane na styczniu-marcu 2026, sprawdzane bez zmian na sierpniu-wrześniu 2026.

[instrument]
symbol = "EURUSD"
contract_size = 100000.0
min_volume_lots = 0.01
volume_step_lots = 0.01
max_volume_lots = 5.0
commission_per_lot_per_side = 3.5
swap_long_per_lot_per_night = -6.0
swap_short_per_lot_per_night = 2.0
leverage = 50.0
slippage_per_oz = 0.00005          # 0,5 pipsa - po publikacji poślizg jest większy niż zwykle
pip_size = 0.0001

[risk]
initial_balance = 500.0
risk_per_trade_pct = 1.0
max_daily_loss_pct = 3.0
max_open_positions = 1
max_spread = 0.0006                # 0,6 pipsa: tuż po publikacji spread jest szerszy
max_margin_usage_pct = 60.0

[strategy]
name = "news_reaction_v1"
nr_event_time = "08:30"
nr_event_tz = "America/New_York"
nr_shock_atr = 4.0
nr_min_move_pips = 5.0
nr_wait_minutes = 2
nr_mode = "momentum"
nr_sl_pips = 10.0
nr_tp_rr = 1.5
max_hold_minutes = 120

[session]
daily_break_start = "21:55"
daily_break_end = "22:05"
no_new_entries_friday_after = "17:00"
close_before_weekend_at = "20:00"
rollover_utc = "22:00"
trade_window_start = "12:00"
trade_window_end = "15:00"
flat_at = "16:30"
max_entry_delay_minutes = 2
max_data_gap_minutes = 10

[calendar]
blackout_before_minutes = 0
blackout_after_minutes = 0
close_positions_before_event = false
